name: Firebase Rules Test

on:
  push:
    branches:
      - security-lab

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Print tested candidate hashes
        run: |
          APP_HASH="$(git hash-object app.js)"
          RULES_HASH="$(git hash-object database.rules.json)"
          TEST_HASH="$(git hash-object firebase.test.js)"
          echo "APP_JS_TESTED_HASH=${APP_HASH}"
          echo "RULES_TESTED_HASH=${RULES_HASH}"
          echo "FIREBASE_TEST_EXECUTED_HASH=${TEST_HASH}"
          {
            echo "## Candidate hashes"
            echo
            echo "- APP_JS_TESTED_HASH: \`${APP_HASH}\`"
            echo "- RULES_TESTED_HASH: \`${RULES_HASH}\`"
            echo "- FIREBASE_TEST_EXECUTED_HASH: \`${TEST_HASH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Firebase Emulator Tests
        id: emulator
        shell: bash
        run: |
          set -o pipefail
          npx firebase emulators:exec --project riskmanager-security-test "npm test" 2>&1 | tee firebase-test-output.log

      - name: Run shift closure smoke test
        id: shift_close
        shell: bash
        run: |
          set -o pipefail
          npm run test:shift-close 2>&1 | tee shift-close-output.log

      - name: Run announcement sanitizer smoke test
        id: announcements
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:announcements 2>&1 | tee announcement-sanitizer-output.log

      - name: Run /logs XSS smoke test
        id: xss
        shell: bash
        run: |
          set -o pipefail
          npm run test:xss 2>&1 | tee xss-smoke-output.log

      - name: Publish auditable test summary
        if: always()
        shell: bash
        env:
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
          SHIFT_CLOSE_OUTCOME: ${{ steps.shift_close.outcome }}
          ANNOUNCEMENTS_OUTCOME: ${{ steps.announcements.outcome }}
          XSS_OUTCOME: ${{ steps.xss.outcome }}
        run: |
          {
            echo
            echo "## Firebase Emulator"
            echo
            if [[ "$EMULATOR_OUTCOME" == "success" ]]; then
              echo "- Previous tests: 19/19 PASS"
              echo "- /permissions tests: 6/6 PASS"
              echo "- /logs tests: 8/8 PASS"
              echo "- shift closure tests: 2/2 PASS"
              echo "- TOTAL: 35"
              echo "- PASS: 35"
              echo "- FAIL: 0"
            else
              echo "- Outcome: $EMULATOR_OUTCOME"
            fi
            echo "- shift closure smoke: $SHIFT_CLOSE_OUTCOME"
            echo "- announcement sanitizer smoke: $ANNOUNCEMENTS_OUTCOME"
            echo "- /logs XSS smoke: $XSS_OUTCOME"
            echo
            echo "### Jest output"
            echo '```text'
            tail -n 80 firebase-test-output.log 2>/dev/null || echo "No test output was produced."
            echo '```'
            echo
            echo "### Shift closure smoke output"
            echo '```text'
            cat shift-close-output.log 2>/dev/null || echo "No shift closure output was produced."
            echo '```'
            echo
            echo "### Announcement sanitizer smoke output"
            echo '```text'
            cat announcement-sanitizer-output.log 2>/dev/null || echo "No announcement sanitizer output was produced."
            echo '```'
            echo
            echo "### XSS smoke output"
            echo '```text'
            cat xss-smoke-output.log 2>/dev/null || echo "No XSS smoke output was produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce smoke test outcomes
        if: always()
        shell: bash
        env:
          ANNOUNCEMENTS_OUTCOME: ${{ steps.announcements.outcome }}
          XSS_OUTCOME: ${{ steps.xss.outcome }}
        run: |
          if [[ "$ANNOUNCEMENTS_OUTCOME" != "success" ]]; then
            while IFS= read -r line; do echo "::error::$line"; done < announcement-sanitizer-output.log
            exit 1
          fi
          if [[ "$XSS_OUTCOME" != "success" ]]; then
            exit 1
          fi
