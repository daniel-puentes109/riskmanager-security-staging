name: Phase 1 Compatibility QA

on:
  workflow_dispatch:

jobs:
  qa-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Enforce Network Isolation
        run: |
          echo "127.0.0.1 riskops-75637.firebaseio.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 riskops-75637.firebasedatabase.app" | sudo tee -a /etc/hosts
          echo "127.0.0.1 firebaseio.com" | sudo tee -a /etc/hosts

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Firebase Tools and QA Dependencies
        run: |
          npm install -g firebase-tools
          cd qa/phase1/tests
          npm install

      - name: Run Firebase Emulators and QA Matrix
        run: |
          cd qa/phase1/tests
          # Start emulators and run tests
          firebase emulators:exec "node qa_matrix.js" --project demo-risk-manager-qa

      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: phase1-qa-artifacts
          path: |
            qa/phase1/tests/phase1-qa-report.txt
            qa/phase1/tests/phase1-qa-report.json
