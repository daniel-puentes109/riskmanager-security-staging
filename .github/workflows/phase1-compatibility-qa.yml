name: Phase 1 Compatibility QA

on:
  workflow_dispatch:

jobs:
  qa-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging QA infra
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Environment Versions
        run: |
          node --version
          npm --version
          java -version

      - name: Decode Rules and Verify Integrity
        env:
          R0_B64: ${{ secrets.R0_RULES_B64 }}
          R1_B64: ${{ secrets.R1_RULES_B64 }}
        run: |
          if [ -z "$R0_B64" ] || [ -z "$R1_B64" ]; then
            echo "Secrets R0_RULES_B64 or R1_RULES_B64 are missing."
            exit 1
          fi
          
          echo "$R0_B64" | base64 -d > $RUNNER_TEMP/r0.json
          echo "$R1_B64" | base64 -d > $RUNNER_TEMP/r1.json
          chmod 600 $RUNNER_TEMP/r0.json $RUNNER_TEMP/r1.json
          
          R0_SHA=$(sha256sum $RUNNER_TEMP/r0.json | awk '{print $1}')
          if [ "$R0_SHA" != "3730f88e2b3f65841bf8ac92d6d53ac761a0449396da6294fb6f1dae53d7fe2d" ]; then
            echo "FAIL: R0 SHA mismatch: $R0_SHA"
            exit 1
          fi
          echo "R0 SHA VERIFIED: $R0_SHA"

      - name: Extract F0/F1
        run: |
          git clone https://github.com/VirtualSoft026/riesgovirtualsoft.git prod_repo
          cd prod_repo
          
          F0_SHA="7046de65c52245294fa5cdfdce8e40dde5f0fa34"
          F1_SHA="cb6eade8d924dcd3ea597d5de13c3d8c5a1c3c07"
          
          git checkout $F0_SHA
          cp app.js $RUNNER_TEMP/app_f0.js
          
          git checkout $F1_SHA
          cp app.js $RUNNER_TEMP/app_f1.js
          
          cd ..
          rm -rf prod_repo

      - name: Enforce Network Isolation
        run: |
          echo "127.0.0.1 riskops-75637.firebaseio.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 riskops-75637.firebasedatabase.app" | sudo tee -a /etc/hosts
          echo "127.0.0.1 firebaseio.com" | sudo tee -a /etc/hosts
          echo "127.0.0.1 firebasedatabase.app" | sudo tee -a /etc/hosts
          
          if curl --connect-timeout 2 -s https://riskops-75637.firebaseio.com/test.json; then
            echo "FAIL: Network is not isolated."
            exit 1
          else
            mkdir -p .github/qa-infra
            echo "NEGATIVE_PRODUCTION_PROBE_BLOCKED = VERIFIED_EXECUTED" > .github/qa-infra/network-summary.txt
            echo "PRODUCTION_NETWORK_REQUESTS = 0" >> .github/qa-infra/network-summary.txt
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup NPM and Run Tests
        env:
          R0_PATH: ${{ runner.temp }}/r0.json
          R1_PATH: ${{ runner.temp }}/r1.json
        run: |
          cd .github/qa-infra
          if [ ! -f package-lock.json ]; then
            npm install
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Auto-generate package-lock.json"
            git push origin HEAD
          fi
          npm ci
          
          cat <<EOF > firebase.json
          {
            "emulators": {
              "auth": { "port": 9099 },
              "database": { "port": 9000 }
            }
          }
          EOF
          
          npx firebase emulators:exec "node qa_matrix.js" --project demo-risk-manager-qa > emulator_raw.log 2>&1
          
          grep -v -E "(FcORj44|oriana)" emulator_raw.log > emulator.log || true
          
      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-qa-artifacts
          path: |
            .github/qa-infra/phase1-qa-report.json
            .github/qa-infra/phase1-qa-report.txt
            .github/qa-infra/network-summary.txt
            .github/qa-infra/emulator.log
          
      - name: Cleanup Secrets
        if: always()
        run: |
          rm -f $RUNNER_TEMP/r0.json $RUNNER_TEMP/r1.json
